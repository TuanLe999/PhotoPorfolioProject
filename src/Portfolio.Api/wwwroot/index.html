<!DOCTYPE html>
<html lang="vi" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio nhiếp ảnh</title>
  <meta name="description" content="Portfolio giới thiệu dịch vụ chụp ảnh.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&family=Space+Grotesk:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/render.css">
  <link rel="stylesheet" href="/assets/css/site.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23e8c37a' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot__mark" id="bootMark">···</div>
    <div class="boot__bar" id="bootBar"></div>
  </div>

  <div class="progress" id="progress"></div>
  <div class="grain"></div>

  <header class="nav" id="nav">
    <a class="nav__logo" href="#top" id="logo">···</a>
    <nav class="nav__links" id="navLinks" aria-label="Điều hướng chính"></nav>
    <button class="nav__burger" id="burger" aria-label="Mở menu" aria-expanded="false">
      <i></i><i></i><i></i>
    </button>
  </header>

  <main id="top">
    <section class="hero" id="hero">
      <div class="hero__bg hero__bg--fallback" id="heroBg"></div>
      <div class="hero__inner">
        <p class="hero__eyebrow" data-anim="fade-up" id="heroEyebrow"></p>
        <h1 class="hero__title" id="heroTitle"></h1>
        <p class="hero__sub" data-anim="fade-up" style="--d:420ms" id="heroSub"></p>
        <div class="hero__actions" data-anim="fade-up" style="--d:560ms" id="heroActions"></div>
      </div>
      <div class="hero__scroll"><i></i> Cuộn xuống</div>
    </section>

    <div class="marquee" aria-hidden="true">
      <div class="marquee__track" id="marquee"></div>
    </div>

    <!-- Các section do admin dựng bằng kéo–thả sẽ được chèn vào đây -->
    <div id="work"></div>

    <section class="about" id="about">
      <div class="about__text" data-anim="fade-right">
        <h2 id="aboutHeading">Về tôi</h2>
        <p id="aboutBody"></p>
        <div class="about__stats" id="aboutStats"></div>
      </div>
      <div class="about__photo" data-anim="fade-left" id="aboutPhoto"></div>
    </section>

    <section class="services" id="services">
      <div class="services__inner">
        <div class="pf-section__head" data-anim="fade-up">
          <div class="pf-section__eyebrow">Dịch vụ</div>
          <h2 class="pf-section__title">Gói chụp &amp; báo giá</h2>
          <p class="pf-section__sub">Mỗi gói đều có thể điều chỉnh theo concept của bạn.</p>
        </div>
        <div class="services__grid" id="servicesGrid"></div>
      </div>
    </section>

    <section class="contact" id="contact">
      <h2 data-anim="fade-up">Kể cho tôi về buổi chụp của bạn</h2>
      <p data-anim="fade-up" style="--d:120ms">Gửi cho tôi ngày, địa điểm và cảm hứng bạn muốn — tôi sẽ trả lời trong 24 giờ.</p>
      <a class="contact__mail" data-anim="fade-up" style="--d:220ms" id="contactMail" href="#"></a>
      <div class="contact__meta" id="contactMeta" data-anim="fade-up" style="--d:320ms"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="footerNote"></span>
    <div class="footer__social" id="footerSocial"></div>
  </footer>

  <a class="admin-link" href="/admin.html">Trang quản trị</a>

  <script type="module" src="/assets/js/site.js"></script>
  <noscript><style>.boot{display:none}</style></noscript>
</body>
</html>
