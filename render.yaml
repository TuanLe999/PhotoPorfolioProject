# Blueprint cho Render: chỉ deploy BACK-END (.NET) kèm ổ đĩa bền vững.
# Front-end React deploy trên Vercel, trỏ VITE_API_URL vào URL của service này.
services:
  - type: web
    name: photo-portfolio-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # cần plan có disk; free plan không mount được disk
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: Admin__Password
        sync: false        # tự nhập trong dashboard, không lưu vào git
      - key: Admin__TokenSecret
        generateValue: true
      - key: Cors__AllowedOrigins__0
        sync: false        # ví dụ: https://ten-app.vercel.app
      - key: Storage__DataDir
        value: /data
      - key: Storage__MediaDir
        value: /data/media
    disk:
      name: portfolio-data
      mountPath: /data     # site.json + ảnh upload nằm ở đây, không mất khi redeploy
      sizeGB: 5
